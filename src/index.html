<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: karamon-shot: https://crafatar.com https://karamon.fr https://textures.minecraft.net; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'" />
  <title>Karamon Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="renderer.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="titlebar" id="drag-region">
  <div class="server-pill">
    <span class="server-status-dot" id="status-dot"></span>
    <span class="server-name">karamon.fr</span>
    <span class="server-status-text" id="status-text">Vérification…</span>
    <span class="server-players" id="server-players">
      <span class="players-tooltip" id="players-tooltip"></span>
    </span>
    <svg class="players-sparkline" id="players-sparkline" viewBox="0 0 80 24" preserveAspectRatio="none" aria-hidden="true">
      <path id="sparkline-path" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
  <button class="account-chip" id="account-chip" type="button" title="Se connecter avec Microsoft">
    <span class="chip-avatar chip-avatar-empty" aria-hidden="true"></span>
    <span class="chip-label">Se connecter</span>
  </button>
  <div class="titlebar-controls">
    <button class="tb-btn" id="btn-minimize" title="Réduire">
      <i data-lucide="minus" class="tb-icon"></i>
    </button>
    <button class="tb-btn" id="btn-maximize" title="Agrandir">
      <i data-lucide="square" class="tb-icon tb-icon--sm"></i>
    </button>
    <button class="tb-btn tb-close" id="btn-close" title="Fermer">
      <i data-lucide="x" class="tb-icon"></i>
    </button>
  </div>
</header>

<div class="app">

  <nav class="sidebar">
    <div class="sidebar-brand">
      <img src="../assets/ui/logo.png" alt="Karamon" class="brand-logo" id="brand-logo" />
    </div>
    <div class="nav-group">
      <button class="nav-btn active" data-panel="home">
        <i data-lucide="house" class="nav-icon"></i>
        <span>Accueil</span>
      </button>
      <button class="nav-btn" data-panel="mods">
        <i data-lucide="package" class="nav-icon"></i>
        <span>Pack</span>
      </button>
      <button class="nav-btn" data-panel="tools">
        <i data-lucide="wrench" class="nav-icon"></i>
        <span>Outils</span>
      </button>
      <button class="nav-btn" data-panel="screenshots">
        <i data-lucide="camera" class="nav-icon"></i>
        <span>Captures</span>
      </button>
      <button class="nav-btn" data-panel="shop">
        <i data-lucide="shopping-bag" class="nav-icon"></i>
        <span>Boutique</span>
      </button>
      <button class="nav-btn" data-panel="settings">
        <i data-lucide="settings" class="nav-icon"></i>
        <span>Paramètres</span>
      </button>
    </div>
    <div class="nav-footer">
      <button class="nav-btn nav-sm" id="btn-folder" title="Ouvrir le dossier instance">
        <i data-lucide="folder" class="nav-icon"></i>
        <span>Dossier</span>
      </button>
      <button class="nav-btn nav-sm" id="btn-logs-toggle">
        <i data-lucide="scroll-text" class="nav-icon"></i>
        <span>Journaux</span>
      </button>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="panels">

    <div class="update-bar" id="update-bar">
      <div class="update-bar-left">
        <i data-lucide="check" class="btn-icon"></i>
        <span id="update-msg"></span>
      </div>
      <div class="update-bar-right">
        <button class="ui-btn ui-btn--primary ui-btn--sm" id="btn-install-update" type="button">Redémarrer</button>
        <button class="ui-btn ui-btn--ghost ui-btn--sm" id="btn-dismiss-update" type="button">Plus tard</button>
      </div>
    </div>

    <div class="update-bar" id="repair-bar">
      <div class="update-bar-left">
        <i data-lucide="wrench" class="btn-icon"></i>
        <span id="repair-msg"></span>
      </div>
      <div class="update-bar-right">
        <button class="btn-update-install" id="btn-repair-relaunch">Relancer</button>
        <button class="btn-update-later"   id="btn-dismiss-repair">Plus tard</button>
      </div>
    </div>

    <div class="update-bar" id="potato-bar">
      <div class="update-bar-left">
        <i data-lucide="gauge" class="btn-icon"></i>
        <span id="potato-msg"></span>
      </div>
      <div class="update-bar-right">
        <button class="ui-btn ui-btn--primary ui-btn--sm" id="btn-potato-enable" type="button">Activer</button>
        <button class="ui-btn ui-btn--ghost ui-btn--sm" id="btn-potato-dismiss" type="button">Non merci</button>
      </div>
    </div>

    <section class="panel active" id="panel-home">
      <div class="home-scroll">
        <div class="hero">
          <img src="../assets/ui/background.webp" alt="" class="hero-bg" />
          <h1 class="hero-page-title">Accueil</h1>
          <div class="hero-bottom">
            <div class="hero-content">
              <img src="../assets/ui/wordmark.webp" alt="Karamon" class="hero-logo" />
              <div class="hero-actions">
                <button class="play-btn" id="btn-play">
                  <span class="play-btn-icon">
                    <i data-lucide="play" class="btn-icon"></i>
                  </span>
                  <span id="play-label">Jouer</span>
                </button>
                <button class="btn-pill" id="btn-hero-sync" type="button">Mettre à jour le pack</button>
              </div>
              <div class="progress-section">
                <div class="progress-track">
                  <div class="progress-bar" id="progress-bar"></div>
                </div>
                <span class="progress-label" id="progress-label">Prêt</span>
              </div>
            </div>

            <div class="activity">
              <h2 class="activity-title">Ton activité</h2>
              <div class="stats-strip" id="stats-strip">
                <div class="stat">
                  <span class="stat-label">Temps de jeu</span>
                  <span class="stat-value" id="stat-playtime">0 min</span>
                </div>
                <div class="stat">
                  <span class="stat-label">Sessions</span>
                  <span class="stat-value" id="stat-sessions">0</span>
                </div>
                <div class="stat">
                  <span class="stat-label">Dernière fois</span>
                  <span class="stat-value" id="stat-last">Jamais</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel page" id="panel-mods"></section>
    <section class="panel page" id="panel-tools"></section>
    <section class="panel page" id="panel-screenshots"></section>
    <section class="panel page" id="panel-shop"></section>
    <section class="panel page" id="panel-settings"></section>

  </main>
</div>

<div class="console-wrap" id="console-wrap">
  <div class="console-header" id="console-toggle">
    <div class="console-header-left">
      <i data-lucide="terminal" class="btn-icon"></i>
      <span>Journaux</span>
    </div>
    <div class="console-header-right">
      <button class="console-action-btn" id="btn-export-logs" title="Exporter les logs">Exporter</button>
      <button class="console-action-btn" id="btn-clear-logs" title="Effacer la console">Effacer</button>
      <button class="console-action-btn console-close-btn" id="console-close">
        <i data-lucide="x" class="btn-icon"></i>
      </button>
    </div>
  </div>
  <div class="console-body" id="console-body">
    <div class="console-lines" id="console-lines"></div>
  </div>
</div>

<div class="pokeball-overlay" id="pokeball-overlay" aria-hidden="true">
  <div class="pokeball">
    <div class="pokeball-top"></div>
    <div class="pokeball-bottom"></div>
    <div class="pokeball-band"></div>
    <div class="pokeball-button"></div>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
