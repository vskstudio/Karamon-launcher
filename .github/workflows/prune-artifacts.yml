name: Prune artifacts

on:
  workflow_run:
    workflows: ["Launcher Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: prune-artifacts
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the artifacts of the two latest runs
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const live = artifacts
              .filter((artifact) => !artifact.expired)
              .sort((a, b) => b.created_at.localeCompare(a.created_at));
            const keptRuns = new Set([...new Set(live.map((artifact) => artifact.workflow_run.id))].slice(0, 2));
            for (const artifact of live) {
              if (keptRuns.has(artifact.workflow_run.id)) continue;
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              core.info(`Deleted ${artifact.name} from run ${artifact.workflow_run.id}`);
            }
