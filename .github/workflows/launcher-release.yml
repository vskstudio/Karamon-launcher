name: Launcher Release

on:
  push:
    branches: [main]
    # Only launcher changes ship a new build; pack content (content/) syncs on its own.
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'build.mjs'
      - 'electron-builder.yml'
      - 'scripts/**'
    tags:
      - 'launcher-v*'

permissions:
  contents: write

concurrency:
  group: launcher-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A pushed tag keeps its own version. A push to main takes the next patch after the
      # latest launcher tag, or package.json when it was bumped by hand past that tag.
      - id: pick
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/launcher-v* ]]; then
            echo "version=${GITHUB_REF_NAME#launcher-v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PKG=$(node -p "require('./package.json').version")
          LAST=$(git tag -l 'launcher-v*' --sort=-v:refname | head -1)
          LAST="${LAST#launcher-v}"
          if [ -z "$LAST" ]; then
            NEXT="$PKG"
          else
            IFS=. read -r MA MI PA <<< "$LAST"
            NEXT=$(printf '%s\n%s\n' "$MA.$MI.$((PA + 1))" "$PKG" | sort -V | tail -1)
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            script: build:dist
          - os: macos-latest
            artifact: macos
            script: build:dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Align package version with release
        shell: bash
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build installer
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            dist/checksums.txt
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: launcher-*
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ needs.version.outputs.version }}"
          {
            echo "Launcher officiel Karamon (Cobbleverse 1.7.42, Fabric 0.18.4, Minecraft 1.21.1)."
            echo
            echo "## Windows"
            echo "Installe \`Karamon Launcher Setup ${VER}.exe\`, connecte-toi avec Microsoft, mets a jour les mods, puis JOUER."
            echo
            echo "## macOS"
            echo "Ouvre le \`.dmg\` (arm64 Apple Silicon, x64 Intel). L'app n'est pas signee: clic droit, Ouvrir."
            echo
            echo "Java 21 est detecte ou installe automatiquement. Le pack se synchronise depuis https://karamon.fr/downloads/."
          } > release-notes.md
          gh release create "launcher-v${VER}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Karamon Launcher ${VER}" \
            --latest \
            --notes-file release-notes.md
