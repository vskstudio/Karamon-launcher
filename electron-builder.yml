appId: fr.karamon.launcher
productName: Karamon Launcher

publish:
  provider: github
  owner: vskstudio
  repo: Karamon-launcher
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
  artifactName: Karamon-Launcher-Setup-${version}.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: assets/icon.png
  category: public.app-category.games

dmg:
  artifactName: Karamon-Launcher-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: assets/icon.png
  category: Game
  artifactName: Karamon-Launcher-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true

# Only what the app loads at runtime. esbuild bundles every dependency into
# dist/*.cjs and dist/renderer.js except electron and adm-zip, and electron-builder
# writes its own output (win-unpacked, linux-unpacked, mac...) into dist/ too:
# a dist/**/* glob shipped a second full Electron inside app.asar.
files:
  - "dist/main.cjs"
  - "dist/preload.cjs"
  - "dist/renderer.js"
  - "dist/renderer.css"
  - "dist/index.html"
  - "dist/styles.css"
  - "dist/pack.json"
  - "dist/client-options.json"
  - "assets/icon.ico"
  - "assets/ui/**/*"
  - "package.json"
  - "!node_modules/**/*"
  - "node_modules/adm-zip/**/*"
